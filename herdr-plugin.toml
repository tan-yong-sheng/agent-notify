id = "agent-notify"
name = "Agent Notify"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Send notifications when agents reach done or blocked."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "test"
title = "Send test notification"
command = ["node", "herdr/herdr-adapter.mjs", "--test"]

[[actions]]
id = "dashboard"
title = "Launch Agent Monitor Dashboard"
command = ["node", "dashboard.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "herdr/herdr-adapter.mjs"]